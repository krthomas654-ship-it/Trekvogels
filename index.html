<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trekvogels nu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
/* ===== KLEUREN (stap 1: hier kun je de kleuren aanpassen) ===== */
:root{
  --lucht:#E3E9EA; --veen:#24332A; --riet:#B8902F; --water:#3F6E7E;
  --blad:#FBFCFA; --mist:#9AA8A3; --leeg:#D3DCDA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --lucht:#18211C; --veen:#E6ECE8; --riet:#D9B04E; --water:#7FB2C2;
    --blad:#202B25; --mist:#6E7D77; --leeg:#2F3B35;
  }
}
:root[data-theme="dark"]{
  --lucht:#18211C; --veen:#E6ECE8; --riet:#D9B04E; --water:#7FB2C2;
  --blad:#202B25; --mist:#6E7D77; --leeg:#2F3B35;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--lucht);color:var(--veen);font-family:"Literata",Georgia,serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:1.5rem 1.1rem 3rem}

h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1;margin:.5rem 0 .4rem;letter-spacing:-.02em}
.sub{margin:0 0 1.5rem;color:var(--mist)}

/* ===== MAANDBALK ===== */
.maanden{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-bottom:.6rem}
.maanden button{font:600 .72rem "Bricolage Grotesque",sans-serif;border:0;border-radius:4px;padding:.7rem 0;background:var(--leeg);color:var(--veen);cursor:pointer}
.maanden button[aria-pressed="true"]{background:var(--veen);color:var(--lucht)}
.maanden button:focus-visible,.vogel summary:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.legenda{display:flex;flex-wrap:wrap;gap:1rem;font-size:.82rem;color:var(--mist);margin-bottom:2rem}
.legenda span::before{content:"";display:inline-block;width:.8em;height:.8em;border-radius:2px;margin-right:.35em;vertical-align:-.05em;background:var(--k)}

/* ===== GROEPEN EN VOGELS ===== */
h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.3rem;margin:2rem 0 .6rem}
h2 small{font-weight:500;color:var(--mist);font-size:.9rem}
.vogel{background:var(--blad);border-radius:10px;margin-bottom:6px}
.vogel summary{list-style:none;cursor:pointer;padding:.8rem .9rem;display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;align-items:center}
.vogel summary::-webkit-details-marker{display:none}
.naam{font-weight:600}
.latijn{font-style:italic;color:var(--mist);font-size:.85rem}
.soort{font:500 .78rem "Bricolage Grotesque",sans-serif;color:var(--mist);grid-row:1/3;grid-column:2}
.jaar{grid-column:1/3;display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:.4rem}
.jaar i{height:7px;border-radius:2px;background:var(--leeg)}
.jaar i.hier{background:var(--mist)}
.jaar i.komt{background:var(--riet)}
.jaar i.gaat{background:var(--water)}
.jaar i.nu{outline:2px solid var(--veen);outline-offset:1px}
.uitleg{padding:0 .9rem .9rem;margin:0;font-size:.92rem}
.leeg{color:var(--mist);font-style:italic}
footer{margin-top:3rem;font-size:.8rem;color:var(--mist)}
</style>
</head>
<body>
<main>
  <h1>Trekvogels nu</h1>
  <p class="sub" id="sub"></p>

  <div class="maanden" id="maanden" role="group" aria-label="Kies een maand"></div>
  <div class="legenda">
    <span style="--k:var(--riet)">komt aan</span>
    <span style="--k:var(--mist)">is hier</span>
    <span style="--k:var(--water)">vertrekt</span>
  </div>

  <div id="lijst"></div>

  <footer>Versie 1. Maanden zijn gemiddelden voor Nederland; per jaar en per plek kan het een paar weken schuiven.</footer>
</main>

<script>
/* =========================================================
   STAP 2: DE VOGELKALENDER
   Elke vogel heeft:
   - naam, latijn
   - soort: "zomer" (broedt hier, overwintert zuidelijk)
            of "winter" (komt hier overwinteren uit het noorden)
   - komt: maanden waarin hij aankomt   (1 = januari)
   - gaat: maanden waarin hij vertrekt
   - tip:  iets om op te letten
   Wil je een vogel toevoegen? Kopieer een regel en pas hem aan.
   ========================================================= */
const VOGELS = [
  // --- zomergasten ---
  {naam:"Grutto", latijn:"Limosa limosa", soort:"zomer", komt:[2,3], gaat:[6,7], tip:"Onze nationale vogel. Komt vroeg uit West-Afrika en vertrekt al midden in de zomer."},
  {naam:"Ooievaar", latijn:"Ciconia ciconia", soort:"zomer", komt:[2,3], gaat:[8], tip:"Een deel blijft tegenwoordig 's winters hier."},
  {naam:"Tjiftjaf", latijn:"Phylloscopus collybita", soort:"zomer", komt:[3], gaat:[9,10], tip:"Roept zijn eigen naam. Vaak de eerste zanger van het voorjaar."},
  {naam:"Zwartkop", latijn:"Sylvia atricapilla", soort:"zomer", komt:[3,4], gaat:[9,10], tip:"Mannetje heeft een zwart petje, vrouwtje een bruin."},
  {naam:"Bruine kiekendief", latijn:"Circus aeruginosus", soort:"zomer", komt:[3,4], gaat:[8,9], tip:"Zweeft laag boven rietvelden met de vleugels in een V."},
  {naam:"Tapuit", latijn:"Oenanthe oenanthe", soort:"zomer", komt:[3,4], gaat:[9], tip:"Vooral doortrekker; let op de witte stuit als hij wegvliegt."},
  {naam:"Boerenzwaluw", latijn:"Hirundo rustica", soort:"zomer", komt:[4], gaat:[9,10], tip:"Lange staartpennen, nestelt in stallen."},
  {naam:"Fitis", latijn:"Phylloscopus trochilus", soort:"zomer", komt:[4], gaat:[8,9], tip:"Lijkt op de tjiftjaf, maar zingt een dalend liedje."},
  {naam:"Gele kwikstaart", latijn:"Motacilla flava", soort:"zomer", komt:[4], gaat:[8,9], tip:"Felgeel, vaak tussen grazend vee."},
  {naam:"Visdief", latijn:"Sterna hirundo", soort:"zomer", komt:[4], gaat:[8,9], tip:"Stoot met een plons in het water op visjes."},
  {naam:"Nachtegaal", latijn:"Luscinia megarhynchos", soort:"zomer", komt:[4], gaat:[8], tip:"Zingt ook 's nachts, verstopt in struiken."},
  {naam:"Grasmus", latijn:"Curruca communis", soort:"zomer", komt:[4], gaat:[8,9], tip:"Doet een zangvluchtje boven braamstruiken."},
  {naam:"Huiszwaluw", latijn:"Delichon urbicum", soort:"zomer", komt:[4,5], gaat:[9], tip:"Witte stuit, bouwt modderen nestjes onder dakgoten."},
  {naam:"Kleine karekiet", latijn:"Acrocephalus scirpaceus", soort:"zomer", komt:[4,5], gaat:[8,9], tip:"Krast eindeloos in het riet."},
  {naam:"Boomvalk", latijn:"Falco subbuteo", soort:"zomer", komt:[4,5], gaat:[9], tip:"Vangt libellen en zwaluwen in de vlucht."},
  {naam:"Koekoek", latijn:"Cuculus canorus", soort:"zomer", komt:[4,5], gaat:[7,8], tip:"Volwassenen vertrekken al in juli, de jongen later."},
  {naam:"Gierzwaluw", latijn:"Apus apus", soort:"zomer", komt:[5], gaat:[7,8], tip:"Komt als een van de laatsten en is als eerste weer weg."},
  {naam:"Wielewaal", latijn:"Oriolus oriolus", soort:"zomer", komt:[5], gaat:[8], tip:"Fluit als een flesje, maar is lastig te zien."},
  // --- wintergasten ---
  {naam:"Smient", latijn:"Mareca penelope", soort:"winter", komt:[9,10], gaat:[3,4], tip:"Fluitend 'wie-oe' van grote groepen in natte weilanden."},
  {naam:"Pijlstaart", latijn:"Anas acuta", soort:"winter", komt:[9,10], gaat:[3,4], tip:"Elegante eend met een lange spitse staart."},
  {naam:"Kolgans", latijn:"Anser albifrons", soort:"winter", komt:[10], gaat:[3], tip:"Witte bles boven de snavel. Vliegt in V-formatie."},
  {naam:"Toendrarietgans", latijn:"Anser serrirostris", soort:"winter", komt:[10], gaat:[3], tip:"Donkere kop, oranje pootjes."},
  {naam:"Brandgans", latijn:"Branta leucopsis", soort:"winter", komt:[10], gaat:[4], tip:"Zwart-wit. Een deel broedt inmiddels ook hier."},
  {naam:"Kramsvogel", latijn:"Turdus pilaris", soort:"winter", komt:[10], gaat:[3,4], tip:"Lijster met grijze kop, zit in bessenstruiken."},
  {naam:"Koperwiek", latijn:"Turdus iliacus", soort:"winter", komt:[10], gaat:[3,4], tip:"Roestrode flank. 's Nachts hoor je ze overvliegen: 'tsiep'."},
  {naam:"Keep", latijn:"Fringilla montifringilla", soort:"winter", komt:[10], gaat:[4], tip:"Familie van de vink, met oranje borst."},
  {naam:"Kleine zwaan", latijn:"Cygnus columbianus", soort:"winter", komt:[10,11], gaat:[3], tip:"Kleiner dan de knobbelzwaan, gele snavelbasis."},
  {naam:"Wilde zwaan", latijn:"Cygnus cygnus", soort:"winter", komt:[11], gaat:[3], tip:"Grote gele vlek op de snavel."}
];

const MAANDNAMEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const VOLLEDIG = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];

/* =========================================================
   STAP 3: HET REKENWERK
   Voor elke maand bepalen we wat de vogel doet.
   ========================================================= */
function status(vogel, maand){
  if (vogel.komt.includes(maand)) return "komt";
  if (vogel.gaat.includes(maand)) return "gaat";
  // Tel vanaf de aankomst door tot het vertrek (ook over de jaarwisseling heen)
  let m = vogel.komt[0];
  const einde = vogel.gaat[vogel.gaat.length - 1];
  while (m !== einde){
    if (m === maand) return "hier";
    m = m % 12 + 1;
  }
  return "weg";
}

/* =========================================================
   STAP 4: OP HET SCHERM ZETTEN
   ========================================================= */
let gekozen = new Date().getMonth() + 1; // de maand van vandaag

function tekenMaanden(){
  const doos = document.getElementById("maanden");
  doos.innerHTML = MAANDNAMEN.map((n,i) =>
    `<button aria-pressed="${i+1===gekozen}" data-m="${i+1}">${n}</button>`).join("");
  doos.querySelectorAll("button").forEach(b =>
    b.onclick = () => { gekozen = +b.dataset.m; tekenAlles(); });
}

function vogelKaart(v){
  const balk = MAANDNAMEN.map((_,i) => {
    const s = status(v, i+1);
    return `<i class="${s}${i+1===gekozen?' nu':''}"></i>`;
  }).join("");
  return `<details class="vogel"><summary>
      <span class="naam">${v.naam}</span>
      <span class="soort">${v.soort==="zomer"?"zomergast":"wintergast"}</span>
      <span class="latijn">${v.latijn}</span>
      <span class="jaar" aria-hidden="true">${balk}</span>
    </summary><p class="uitleg">${v.tip}</p></details>`;
}

function groep(titel, vogels){
  const inhoud = vogels.length
    ? vogels.map(vogelKaart).join("")
    : `<p class="leeg">Geen soorten in deze maand.</p>`;
  return `<h2>${titel} <small>${vogels.length}</small></h2>${inhoud}`;
}

function tekenAlles(){
  tekenMaanden();
  const vandaag = new Date().getMonth() + 1;
  document.getElementById("sub").textContent =
    gekozen === vandaag ? `Wat er in ${VOLLEDIG[gekozen-1]} gebeurt in Nederland.`
                        : `Je kijkt naar ${VOLLEDIG[gekozen-1]}.`;
  const per = s => VOGELS.filter(v => status(v, gekozen) === s);
  document.getElementById("lijst").innerHTML =
    groep("Komen nu aan", per("komt")) +
    groep("Vertrekken nu", per("gaat")) +
    groep("Zijn er nu", per("hier"));
}

tekenAlles();
</script>
</body>
</html>
