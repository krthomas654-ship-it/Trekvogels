<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trekvogels nu</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#24332A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
/* ===== KLEUREN (stap 1: hier kun je de kleuren aanpassen) ===== */
:root{
  --lucht:#E3E9EA; --veen:#24332A; --riet:#B8902F; --water:#3F6E7E;
  --blad:#FBFCFA; --mist:#9AA8A3; --leeg:#D3DCDA; --door:#7E9A6B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --lucht:#18211C; --veen:#E6ECE8; --riet:#D9B04E; --water:#7FB2C2;
    --blad:#202B25; --mist:#6E7D77; --leeg:#2F3B35; --door:#97B583;
  }
}
:root[data-theme="dark"]{
  --lucht:#18211C; --veen:#E6ECE8; --riet:#D9B04E; --water:#7FB2C2;
  --blad:#202B25; --mist:#6E7D77; --leeg:#2F3B35; --door:#97B583;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--lucht);color:var(--veen);font-family:"Literata",Georgia,serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:1.5rem 1.1rem 3rem}

h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1;margin:.5rem 0 .4rem;letter-spacing:-.02em}
.sub{margin:0 0 1.5rem;color:var(--mist)}

/* ===== MAANDBALK ===== */
.maanden{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-bottom:.6rem}
.maanden button{font:600 .72rem "Bricolage Grotesque",sans-serif;border:0;border-radius:4px;padding:.7rem 0;background:var(--leeg);color:var(--veen);cursor:pointer}
.maanden button[aria-pressed="true"]{background:var(--veen);color:var(--lucht)}
.maanden button:focus-visible,.vogel summary:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.legenda{display:flex;flex-wrap:wrap;gap:1rem;font-size:.82rem;color:var(--mist);margin-bottom:2rem}
.legenda span::before{content:"";display:inline-block;width:.8em;height:.8em;border-radius:2px;margin-right:.35em;vertical-align:-.05em;background:var(--k)}

/* ===== GROEPEN EN VOGELS ===== */
h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.3rem;margin:2rem 0 .6rem}
h2 small{font-weight:500;color:var(--mist);font-size:.9rem}
.vogel{background:var(--blad);border-radius:10px;margin-bottom:6px}
.vogel summary{list-style:none;cursor:pointer;padding:.8rem .9rem;display:grid;grid-template-columns:56px 1fr auto;gap:.15rem .8rem;align-items:center}
.foto{grid-row:1/3;grid-column:1;width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--leeg);display:flex;align-items:center;justify-content:center;font:700 1.3rem "Bricolage Grotesque",sans-serif;color:var(--mist)}
.naam{grid-column:2;grid-row:1}
.groot{display:block;width:calc(100% - 1.8rem);margin:0 .9rem .5rem;max-height:300px;object-fit:cover;border-radius:8px}
.bron{display:block;padding:0 .9rem .9rem;font-size:.75rem;color:var(--mist)}
.bron a{color:inherit}
.vogel summary::-webkit-details-marker{display:none}
.naam{font-weight:600}
.latijn{grid-column:2;grid-row:2;font-style:italic;color:var(--mist);font-size:.85rem}
.soort{font:500 .78rem "Bricolage Grotesque",sans-serif;color:var(--mist);grid-row:1/3;grid-column:3}
.jaar{grid-column:1/4;display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:.4rem}
.jaar i{height:7px;border-radius:2px;background:var(--leeg)}
.jaar i.hier{background:var(--mist)}
.jaar i.komt{background:var(--riet)}
.jaar i.gaat{background:var(--water)}
.jaar i.door{background:var(--door)}
.route{padding:0 .9rem .6rem;margin:0;font-size:.9rem}
.route b{font-weight:600}
.geluid{padding:0 .9rem .7rem}
.geluid audio{width:100%;margin-top:.2rem}
.speel{font:600 .9rem "Bricolage Grotesque",sans-serif;padding:.55rem 1rem;border-radius:999px;border:0;background:var(--water);color:var(--blad);cursor:pointer}
.speel:disabled{opacity:.6;cursor:default}
.speel:focus-visible{outline:2px solid var(--veen);outline-offset:2px}
.geluid .bron{padding:.3rem 0 0}
.zoek{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem}
.zoek input{flex:1 1 100%;font:inherit;padding:.65rem .8rem;border-radius:8px;border:1px solid var(--leeg);background:var(--blad);color:var(--veen)}
.zoek button{font:500 .85rem "Bricolage Grotesque",sans-serif;padding:.45rem .8rem;border-radius:999px;border:1px solid var(--leeg);background:transparent;color:var(--veen);cursor:pointer}
.zoek button[aria-pressed="true"]{background:var(--veen);color:var(--lucht);border-color:var(--veen)}
.zoek input:focus-visible,.zoek button:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.jaar i.nu{outline:2px solid var(--veen);outline-offset:1px}
.uitleg{padding:0 .9rem .6rem;margin:0;font-size:.92rem}
.leeg{color:var(--mist);font-style:italic}
footer{margin-top:3rem;font-size:.8rem;color:var(--mist)}
</style>
</head>
<body>
<main>
  <h1>Trekvogels nu</h1>
  <p class="sub" id="sub"></p>

  <div class="maanden" id="maanden" role="group" aria-label="Kies een maand"></div>
  <div class="legenda">
    <span style="--k:var(--riet)">komt aan</span>
    <span style="--k:var(--mist)">is hier</span>
    <span style="--k:var(--water)">vertrekt</span>
    <span style="--k:var(--door)">trekt door</span>
  </div>

  <div class="zoek">
    <input id="zoekveld" type="search" placeholder="Zoek een vogel" aria-label="Zoek een vogel">
    <button data-f="alle" aria-pressed="true">Alle</button>
    <button data-f="zomer" aria-pressed="false">Zomergasten</button>
    <button data-f="winter" aria-pressed="false">Wintergasten</button>
    <button data-f="door" aria-pressed="false">Doortrekkers</button>
  </div>

  <div id="lijst"></div>

  <footer>Versie 5. Geluiden via Wikimedia Commons. Regelmatige trekvogels van Friesland. Foto's via Wikipedia en Wikimedia Commons. Maanden zijn gemiddelden voor Nederland; per jaar en per plek kan het een paar weken schuiven.</footer>
</main>

<script>

   Elke vogel heeft:
   - naam, latijn
   - soort: "zomer" (broedt hier, overwintert zuidelijk)
            of "winter" (komt hier overwinteren uit het noorden)
   - komt: maanden waarin hij aankomt   (1 = januari)
   - gaat: maanden waarin hij vertrekt
   - tip:  iets om op te letten
   Wil je een vogel toevoegen? Kopieer een regel en pas hem aan.

  {naam:"Tjiftjaf", latijn:"Phylloscopus collybita", soort:"zomer", komt:[3], gaat:[9,10], route:"Spanje, Portugal en Noord-Afrika", tip:"Roept zijn eigen naam. Vaak de eerste zanger van het voorjaar."},

const MAANDNAMEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const VOLLEDIG = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];

/* =========================================================
   STAP 3: HET REKENWERK
   Voor elke maand bepalen we wat de vogel doet.
   ========================================================= */
function status(vogel, maand){
  if (vogel.soort === "door"){
    return (vogel.voorjaar.includes(maand) || vogel.najaar.includes(maand)) ? "door" : "weg";
  }
  if (vogel.komt.includes(maand)) return "komt";
  if (vogel.gaat.includes(maand)) return "gaat";
  // Tel vanaf de aankomst door tot het vertrek (ook over de jaarwisseling heen)
  let m = vogel.komt[0];
  const einde = vogel.gaat[vogel.gaat.length - 1];
  while (m !== einde){
    if (m === maand) return "hier";
    m = m % 12 + 1;
  }
  return "weg";
}

/* =========================================================
   STAP 4: OP HET SCHERM ZETTEN
   ========================================================= */
let gekozen = new Date().getMonth() + 1; // de maand van vandaag
let FOTOS = {};                            // hier komen de foto's in
let filter = "alle";                       // welke soort vogels je wilt zien
let zoekterm = "";                         // wat je in het zoekveld typt
const SOORTNAAM  = {zomer:"zomergast", winter:"wintergast", door:"doortrekker"};
const ROUTELABEL = {zomer:"Overwintert in:", winter:"Broedt in:", door:"Route:"};

/* =========================================================
   STAP 5: FOTO'S HALEN BIJ WIKIPEDIA
   We vragen Wikipedia in één keer: "geef me de hoofdfoto
   bij al deze Latijnse namen". Daarna vragen we Wikimedia
   Commons wie de foto gemaakt heeft, zodat we die netjes
   kunnen noemen. Het resultaat bewaren we op je telefoon,
   zodat het de volgende keer meteen klaar staat.
   ========================================================= */
const FOTO_GEHEUGEN = "trekvogels-fotos-v1";

function tekst(html){ const d = document.createElement("div"); d.innerHTML = html || ""; return d.textContent.trim(); }
function veilig(t){ return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function haalFotos(){
  let geheugen = {};
  try { geheugen = JSON.parse(localStorage.getItem(FOTO_GEHEUGEN)) || {}; } catch(e){}
  if (VOGELS.every(v => geheugen[v.latijn])) return geheugen;

  // Wikipedia accepteert maximaal 50 namen per keer, dus we vragen in porties
  const ontbreekt = VOGELS.filter(v => !geheugen[v.latijn]).map(v => v.latijn);
  for (let i = 0; i < ontbreekt.length; i += 50){
    const portie = ontbreekt.slice(i, i + 50);

    // Vraag 1: welke foto hoort bij elke vogel?
    const url1 = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1"
               + "&prop=pageimages&piprop=thumbnail|name&pithumbsize=600&titles=" + encodeURIComponent(portie.join("|"));
    const q = (await (await fetch(url1)).json()).query;
    const doorsturen = {};
    (q.normalized || []).forEach(n => doorsturen[n.from] = n.to);
    (q.redirects  || []).forEach(n => doorsturen[n.from] = n.to);
    const paginas = {};
    Object.values(q.pages).forEach(p => paginas[p.title] = p);

    const nieuw = [];
    portie.forEach(latijn => {
      let t = latijn;
      for (let j = 0; j < 3 && doorsturen[t]; j++) t = doorsturen[t];
      const p = paginas[t];
      if (p && p.thumbnail && p.pageimage){
        geheugen[latijn] = { src: p.thumbnail.source, bestand: p.pageimage, maker: "", licentie: "" };
        nieuw.push(latijn);
      }
    });

    // Vraag 2: wie maakte de foto en onder welke licentie?
    if (nieuw.length){
      const bestanden = nieuw.map(l => "File:" + geheugen[l].bestand);
      const url2 = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*"
                 + "&prop=imageinfo&iiprop=extmetadata&titles=" + encodeURIComponent(bestanden.join("|"));
      const r2 = (await (await fetch(url2)).json()).query;
      const info = {};
      Object.values(r2.pages).forEach(p => {
        const m = p.imageinfo && p.imageinfo[0].extmetadata;
        if (m) info[p.title.replace(/^File:/, "").replace(/_/g, " ")] = {
          maker: tekst(m.Artist && m.Artist.value),
          licentie: (m.LicenseShortName && m.LicenseShortName.value) || ""
        };
      });
      nieuw.forEach(l => {
        const i2 = info[geheugen[l].bestand.replace(/_/g, " ")];
        if (i2){ geheugen[l].maker = i2.maker; geheugen[l].licentie = i2.licentie; }
      });
    }
  }

  try { localStorage.setItem(FOTO_GEHEUGEN, JSON.stringify(geheugen)); } catch(e){}
  return geheugen;
}

function tekenMaanden(){
  const doos = document.getElementById("maanden");
  doos.innerHTML = MAANDNAMEN.map((n,i) =>
    `<button aria-pressed="${i+1===gekozen}" data-m="${i+1}">${n}</button>`).join("");
  doos.querySelectorAll("button").forEach(b =>
    b.onclick = () => { gekozen = +b.dataset.m; tekenAlles(); });
}

function vogelKaart(v){
  const balk = MAANDNAMEN.map((_,i) => {
    const s = status(v, i+1);
    return `<i class="${s}${i+1===gekozen?' nu':''}"></i>`;
  }).join("");
  const f = FOTOS[v.latijn];
  const klein = f
    ? `<img class="foto" src="${f.src}" alt="" loading="lazy">`
    : `<span class="foto" aria-hidden="true">${v.naam[0]}</span>`;
  const groot = f
    ? `<img class="groot" src="${f.src}" alt="Foto van een ${v.naam.toLowerCase()}" loading="lazy">
       <small class="bron">Foto: ${veilig(f.maker || "onbekend")}${f.licentie ? ", " + veilig(f.licentie) : ""},
       <a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(f.bestand)}" target="_blank" rel="noopener">Wikimedia Commons</a></small>`
    : "";
  return `<details class="vogel"><summary>
      ${klein}
      <span class="naam">${v.naam}</span>
      <span class="soort">${SOORTNAAM[v.soort]}</span>
      <span class="latijn">${v.latijn}</span>
      <span class="jaar" aria-hidden="true">${balk}</span>
    </summary><p class="uitleg">${v.tip}</p>
    <p class="route"><b>${ROUTELABEL[v.soort]}</b> ${v.route}</p>
    <div class="geluid" data-l="${v.latijn}"><button class="speel">▶ Laat horen</button></div>${groot}</details>`;
}

function groep(titel, vogels){
  const inhoud = vogels.length
    ? vogels.map(vogelKaart).join("")
    : `<p class="leeg">Geen soorten in deze maand.</p>`;
  return `<h2>${titel} <small>${vogels.length}</small></h2>${inhoud}`;
}

function tekenAlles(){
  tekenMaanden();
  const vandaag = new Date().getMonth() + 1;
  document.getElementById("sub").textContent =
    gekozen === vandaag ? `Wat er in ${VOLLEDIG[gekozen-1]} gebeurt in Nederland.`
                        : `Je kijkt naar ${VOLLEDIG[gekozen-1]}.`;
  const zichtbaar = VOGELS.filter(v =>
    (filter === "alle" || v.soort === filter) &&
    (v.naam + " " + v.latijn).toLowerCase().includes(zoekterm));
  const per = s => zichtbaar.filter(v => status(v, gekozen) === s);
  document.getElementById("lijst").innerHTML =
    groep("Komen nu aan", per("komt")) +
    groep("Trekken nu door", per("door")) +
    groep("Vertrekken nu", per("gaat")) +
    groep("Zijn er nu", per("hier"));
}

/* =========================================================
   STAP 8: VOGELGELUIDEN
   Pas als je op "Laat horen" tikt, zoekt de app op
   Wikimedia Commons naar een geluidsopname met de Latijnse
   naam erin. Sommige vogels hebben een nieuwe Latijnse naam
   gekregen; oude opnames staan nog onder de oude naam,
   dus die proberen we daarna.
   ========================================================= */
const OUDE_NAMEN = {
  "Calidris pugnax":["Philomachus pugnax"], "Curruca communis":["Sylvia communis"],
  "Curruca curruca":["Sylvia curruca"], "Spatula querquedula":["Anas querquedula"],
  "Mareca penelope":["Anas penelope"], "Hydrocoloeus minutus":["Larus minutus"],
  "Linaria flavirostris":["Carduelis flavirostris"], "Acanthis flammea":["Carduelis flammea"],
  "Spinus spinus":["Carduelis spinus"], "Saxicola rubicola":["Saxicola torquata","Saxicola torquatus"],
  "Anser serrirostris":["Anser fabalis"], "Thalasseus sandvicensis":["Sterna sandvicensis"],
  "Sternula albifrons":["Sterna albifrons"], "Mergellus albellus":["Mergus albellus"]
};
const GELUID_GEHEUGEN = "trekvogels-geluiden-v1";

async function zoekGeluid(latijn){
  let geheugen = {};
  try { geheugen = JSON.parse(localStorage.getItem(GELUID_GEHEUGEN)) || {}; } catch(e){}
  if (geheugen[latijn]) return geheugen[latijn];

  for (const naam of [latijn, ...(OUDE_NAMEN[latijn] || [])]){
    const url = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*"
              + "&generator=search&gsrnamespace=6&gsrlimit=20"
              + "&gsrsearch=" + encodeURIComponent('filetype:audio "' + naam + '"')
              + "&prop=imageinfo&iiprop=url|mime|extmetadata";
    const antwoord = await (await fetch(url)).json();
    if (!antwoord.query) continue;

    const klein = naam.toLowerCase();
    const kandidaten = Object.values(antwoord.query.pages)
      .filter(p => p.imageinfo && /audio|ogg/.test(p.imageinfo[0].mime))
      .filter(p => (p.title + " " + tekst(p.imageinfo[0].extmetadata?.ImageDescription?.value)).toLowerCase().includes(klein))
      .sort((a, b) => a.index - b.index)
      .sort((a, b) => /song|zang/i.test(b.title) - /song|zang/i.test(a.title)); // zang gaat voor

    if (kandidaten.length){
      const p = kandidaten[0], info = p.imageinfo[0], m = info.extmetadata || {};
      const gevonden = {
        url: info.url,
        bestand: p.title.replace(/^File:/, ""),
        maker: tekst(m.Artist && m.Artist.value),
        licentie: (m.LicenseShortName && m.LicenseShortName.value) || ""
      };
      geheugen[latijn] = gevonden;
      try { localStorage.setItem(GELUID_GEHEUGEN, JSON.stringify(geheugen)); } catch(e){}
      return gevonden;
    }
  }
  return null;
}

document.getElementById("lijst").addEventListener("click", async e => {
  const knop = e.target.closest(".speel");
  if (!knop) return;
  const doos = knop.parentElement;
  knop.disabled = true;
  knop.textContent = "Geluid zoeken…";
  try {
    const g = await zoekGeluid(doos.dataset.l);
    if (!g){ doos.innerHTML = `<small class="bron">Geen opname gevonden voor deze soort.</small>`; return; }
    doos.innerHTML = `<audio controls autoplay src="${g.url}"></audio>
      <small class="bron">Geluid: ${veilig(g.maker || "onbekend")}${g.licentie ? ", " + veilig(g.licentie) : ""},
      <a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(g.bestand)}" target="_blank" rel="noopener">Wikimedia Commons</a></small>`;
  } catch(err){
    knop.disabled = false;
    knop.textContent = "▶ Opnieuw proberen";
  }
});

/* STAP 7: ZOEKEN EN FILTEREN */
document.getElementById("zoekveld").oninput = e => { zoekterm = e.target.value.trim().toLowerCase(); tekenAlles(); };
document.querySelectorAll(".zoek button").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll(".zoek button").forEach(x => x.setAttribute("aria-pressed", x === b));
  tekenAlles();
});

tekenAlles();                                   // eerst zonder foto's
haalFotos()
  .then(f => { FOTOS = f; tekenAlles(); })      // dan opnieuw, mét foto's
  .catch(() => {});                             // geen internet? dan zonder foto's

/* STAP 6: HET HELPERTJE AANZETTEN (voor gebruik zonder bereik) */
if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js").catch(() => {});
}
